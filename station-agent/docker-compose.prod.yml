name: print-station-kiosk-prod

services:
  kiosk-ui:
    image: vanhoadotbui2628/print-station-boilerplate-kiosk-ui:latest
    build:
      context: .
      dockerfile: services/kiosk-ui/docker/Dockerfile
    container_name: print-station-kiosk-ui-prod
    restart: unless-stopped
    ports:
      - "5222:5007"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5007
      STATION_ID: STATION-01

      # External dependencies hosted by the current local print station.
      REDIS_CONNECTION_STRING: "100.82.195.220:6380,password=changeme"
      RabbitMq__Host: 100.82.195.220
      RabbitMq__Port: "5673"
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      RabbitMq__VirtualHost: /
      RabbitMq__DefaultExchange: station.events

      # Station APIs reachable through the cloud/local-server link.
      PROJECTION_SERVICE_URL: http://100.82.195.220:5009
      JOB_ENGINE_HOST: 100.82.195.220
      JOB_ENGINE_PORT: "5002"
      PRINTER_ADAPTER_URL: http://100.82.195.220:5003

      SQLITE_KIOSK_PATH: /data/kiosk.db
      Jwt__Secret: REPLACE_WITH_A_LONG_RANDOM_PRODUCTION_SECRET_AT_LEAST_32_CHARS
      Jwt__Issuer: nd-station-agent
      Jwt__Audience: nd-kiosk
      LOCAL_ADMIN_PASSWORD: REPLACE_BEFORE_PRODUCTION_DEPLOYMENT
      ALARM_SEED_ENABLED: "true"
      ALARM_SEED_PASSWORD: AlarmDemo!2026
      CORS_ORIGINS: https://nguyenduongdemo.ddns.net,http://100.82.195.220:5222

    volumes:
      - print-station-kiosk-data:/data
      - print-station-kiosk-logs:/logs
    networks:
      - print-station-kiosk-prod-net

volumes:
  print-station-kiosk-data:
    name: print-station-kiosk-prod-data
  print-station-kiosk-logs:
    name: print-station-kiosk-prod-logs

networks:
  print-station-kiosk-prod-net:
    name: print-station-kiosk-prod-net
    driver: bridge
